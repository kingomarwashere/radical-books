<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reader · Radical Books</title>
<link rel="stylesheet" href="/style.css">
<!-- Self-hosted so ad-blockers / Brave shields can't block the reader (jsdelivr was blocked). -->
<script src="/vendor/jszip.min.js"></script>
<script src="/vendor/epub.min.js"></script>
<style>
  body{overflow:hidden}
  .rtop{position:fixed;top:0;left:0;right:0;height:calc(52px + var(--safe-top));padding-top:var(--safe-top);
    display:flex;align-items:center;gap:12px;padding-left:16px;padding-right:16px;background:var(--bg2);border-bottom:1px solid var(--line);z-index:20}
  .rtop .bk{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .rtop button{width:36px;height:36px;border-radius:8px;color:var(--dim)}
  .rtop button:hover{background:var(--bg3);color:var(--ink)}
  #viewer{position:fixed;top:calc(52px + var(--safe-top));bottom:calc(46px + var(--safe-bot));left:0;right:0}
  .rbot{position:fixed;bottom:0;left:0;right:0;height:calc(46px + var(--safe-bot));padding-bottom:var(--safe-bot);
    display:flex;align-items:center;gap:14px;padding-left:16px;padding-right:16px;background:var(--bg2);border-top:1px solid var(--line);z-index:20}
  .rbot .pct{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none}
  .rprog{flex:1;height:4px;border-radius:2px;background:var(--bg3);cursor:pointer;position:relative}
  .rprog i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:2px}
  .arrow{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:80px;display:flex;align-items:center;justify-content:center;color:var(--dim2);z-index:10;font-size:28px}
  .arrow:hover{color:var(--ink)} .arrow.l{left:0} .arrow.r{right:0}
  body.sepia{--paper:#f4ecd8;--paperink:#5b4636} body.light{--paper:#fff;--paperink:#111} body:not(.sepia):not(.light){--paper:#0f0e0c;--paperink:#d8d3c7}
  .loadmsg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--dim)}
</style>
</head>
<body class="sepia">
<div class="rtop">
  <button onclick="history.length>1?history.back():location.href='/'" title="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <div class="bk" id="bkTitle">Loading…</div>
  <button id="btnTheme" title="Theme">◑</button>
  <button id="btnMinus" title="Smaller text">A−</button>
  <button id="btnPlus" title="Larger text">A+</button>
</div>
<div id="viewer"></div>
<div class="arrow l" id="prev">‹</div>
<div class="arrow r" id="next">›</div>
<div class="rbot"><span class="pct" id="pct">0%</span><div class="rprog" id="rprog"><i id="rprogFill"></i></div><span class="pct" id="chap"></span></div>
<div class="loadmsg" id="load"><div class="spin"></div><div>Opening book…</div></div>

<script type="module">
const bookId = new URLSearchParams(location.search).get('book');
const api = async (p, o) => { const r = await fetch(p, { headers: { 'Content-Type': 'application/json' }, ...o }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error), { status: r.status }); return j; };
let book, rendition, saved = null, fontSize = parseInt(localStorage.rbFont || '110');

async function boot() {
  if (!bookId) return location.href = '/';
  let detail;
  try { detail = await api(`/api/book/${bookId}`); } catch { return location.href = '/'; }
  document.getElementById('bkTitle').textContent = detail.book.title;
  saved = detail.progress?.ebook || null;
  // Gate check + format: the proxy endpoint 402s if unpaid.
  let format = 'epub';
  try {
    const test = await fetch(`/api/book/${bookId}/ebook/url`);
    if (test.status === 402) return location.href = '/upgrade';
    if (test.status === 401) return location.href = `/?auth=login`;
    if (test.ok) { const jd = await test.json().catch(() => ({})); format = jd.format || 'epub'; }
  } catch {}
  // PDF editions (some Internet Archive books): use the browser's native viewer.
  if (format === 'pdf') return openPdf();
  if (typeof ePub === 'undefined') return fail('Reader failed to load. Please refresh.');
  // Fetch the epub as an ArrayBuffer and hand THAT to epub.js. Passing a URL makes
  // epub.js sniff the extension — our URL ends in "/ebook/file" (no .epub), so it
  // wrongly treats the book as an unpacked directory and hangs. An ArrayBuffer is
  // always opened as a zip archive (typeof !== 'string' → archived mode).
  let buf;
  try {
    const r = await fetch(`/api/book/${bookId}/ebook/file?format=epub`);
    if (!r.ok) return fail('Could not load this book (' + r.status + '). It may still be processing.');
    buf = await r.arrayBuffer();
    if (!buf.byteLength) return fail('This book file is empty. It may still be processing — try again shortly.');
  } catch { return fail('Network error loading this book. Please retry.'); }
  try { book = ePub(buf); } catch (e) { return fail('Could not open this book (' + (e.message || 'error') + ').'); }
  rendition = book.renderTo('viewer', { width: '100%', height: '100%', flow: 'paginated', spread: 'auto' });
  applyTheme();
  // Never hang forever — if the book can't be parsed, surface an error.
  const guard = setTimeout(() => fail('This book couldn’t be opened. It may still be processing — try again shortly.'), 25000);
  try { await book.ready; } catch { clearTimeout(guard); return fail('This book file appears to be corrupted or unsupported.'); }
  await rendition.display(saved?.locator || undefined);
  clearTimeout(guard);
  document.getElementById('load').style.display = 'none';
  book.ready.then(() => book.locations.generate(1600)).then(() => updatePct());
  rendition.on('relocated', (loc) => {
    saveProgress(loc);
    updatePct(loc);
  });
  rendition.on('keyup', (e) => { if (e.key === 'ArrowRight') rendition.next(); if (e.key === 'ArrowLeft') rendition.prev(); });
  document.addEventListener('keyup', (e) => { if (e.key === 'ArrowRight') rendition.next(); if (e.key === 'ArrowLeft') rendition.prev(); });
}

function updatePct(loc) {
  loc = loc || rendition?.currentLocation();
  let pct = 0;
  try { pct = book.locations.percentageFromCfi(loc?.start?.cfi) || 0; } catch {}
  document.getElementById('pct').textContent = Math.round(pct * 100) + '%';
  document.getElementById('rprogFill').style.width = (pct * 100) + '%';
}
let lastSave = 0;
function saveProgress(loc) {
  const now = Date.now(); if (now - lastSave < 4000) return; lastSave = now;
  let pct = 0; try { pct = book.locations.percentageFromCfi(loc.start.cfi) || 0; } catch {}
  api(`/api/book/${bookId}/progress`, { method: 'POST', body: JSON.stringify({ mediaType: 'ebook', locator: loc.start.cfi, percent: pct, finished: pct > 0.98 }) }).catch(() => {});
}
function applyTheme() {
  const paper = getComputedStyle(document.body).getPropertyValue('--paper').trim();
  const ink = getComputedStyle(document.body).getPropertyValue('--paperink').trim();
  rendition?.themes.override('color', ink);
  rendition?.themes.override('background', paper);
  rendition?.themes.fontSize(fontSize + '%');
  document.getElementById('viewer').style.background = paper;
}
document.getElementById('prev').onclick = () => rendition?.prev();
document.getElementById('next').onclick = () => rendition?.next();
document.getElementById('btnPlus').onclick = () => { fontSize = Math.min(200, fontSize + 15); localStorage.rbFont = fontSize; rendition?.themes.fontSize(fontSize + '%'); };
document.getElementById('btnMinus').onclick = () => { fontSize = Math.max(70, fontSize - 15); localStorage.rbFont = fontSize; rendition?.themes.fontSize(fontSize + '%'); };
document.getElementById('btnTheme').onclick = () => {
  const order = ['sepia', 'light', 'dark'];
  const cur = document.body.classList.contains('sepia') ? 'sepia' : document.body.classList.contains('light') ? 'light' : 'dark';
  const nextT = order[(order.indexOf(cur) + 1) % 3];
  document.body.className = nextT === 'dark' ? '' : nextT;
  applyTheme();
};
document.getElementById('rprog').onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  const cfi = book?.locations?.cfiFromPercentage((e.clientX - r.left) / r.width);
  if (cfi) rendition.display(cfi);
};
// PDF fallback — render in the browser's native PDF viewer (no pdf.js needed).
function openPdf() {
  const v = document.getElementById('viewer');
  v.style.top = 'calc(52px + var(--safe-top))'; v.style.bottom = '0';
  v.innerHTML = `<iframe title="PDF" src="/api/book/${bookId}/ebook/file?format=pdf" style="width:100%;height:100%;border:0;background:#fff"></iframe>`;
  document.getElementById('load').style.display = 'none';
  for (const id of ['prev', 'next', 'btnPlus', 'btnMinus', 'btnTheme']) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }
  const bot = document.querySelector('.rbot'); if (bot) bot.style.display = 'none';
}
let failed = false;
function fail(msg) {
  if (failed) return; failed = true;
  const l = document.getElementById('load');
  l.style.display = 'flex';
  l.innerHTML = `<div style="max-width:340px;text-align:center;color:var(--paperink,#5b4636)">
    <div style="font-size:15px;margin-bottom:16px">${msg}</div>
    <button onclick="location.reload()" style="padding:10px 20px;border-radius:99px;background:var(--red);color:#fff;font-weight:700;margin-right:8px">Retry</button>
    <button onclick="history.length>1?history.back():location.href='/'" style="padding:10px 20px;border-radius:99px;background:#0002;color:inherit">Back</button>
  </div>`;
}
boot().catch(e => fail('This book couldn’t be opened (' + (e.message || 'error') + ').'));
</script>
</body>
</html>
